services:
  db:
    image: postgis/postgis:16-3.4
    container_name: elonuz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elonuz
      POSTGRES_PASSWORD: elonuz
      POSTGRES_DB: elonuz
    # Bound to 127.0.0.1 ONLY — Postgres is reachable from the server's loopback (for an SSH
    # tunnel / admin GUI) but never from the public internet. Do NOT change to '5432:5432' or
    # '0.0.0.0:...': that would expose elonuz:elonuz to the world.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - elonuz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elonuz -d elonuz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elonuz-redis
    restart: unless-stopped
    volumes:
      - elonuz-redis-data:/data

  # One-shot: applies migrations and seeds the catalog, then exits. Built from the `build`
  # stage because the runtime image installs with --omit=dev and so has neither the Prisma
  # CLI nor ts-node. Running it as its own service also keeps migrations to a single run,
  # independent of how many backend replicas start.
  migrate:
    build:
      context: .
      target: build
    container_name: elonuz-migrate
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: 'no'

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env
    # Overrides whatever .env says: inside the compose network the database is `db`,
    # never localhost. `environment` takes precedence over `env_file`.
    environment:
      DATABASE_URL: postgresql://elonuz:elonuz@db:5432/elonuz?schema=public

  backend:
    build: .
    container_name: elonuz-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    env_file:
      - .env
    # Same reason as above — service names, not localhost.
    environment:
      DATABASE_URL: postgresql://elonuz:elonuz@db:5432/elonuz?schema=public
      REDIS_URL: redis://redis:6379

    ports:
      - '3000:3000'

volumes:
  elonuz-db-data:
  elonuz-redis-data:
