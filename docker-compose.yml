services:
  db:
    image: postgis/postgis:16-3.4
    container_name: elonuz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elonuz
      POSTGRES_PASSWORD: elonuz
      POSTGRES_DB: elonuz
    volumes:
      - elonuz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elonuz -d elonuz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elonuz-redis
    restart: unless-stopped
    volumes:
      - elonuz-redis-data:/data

  backend:
    build: .
    container_name: elonuz-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    env_file:
      - .env

    ports:
      - '3000:3000'

volumes:
  elonuz-db-data:
  elonuz-redis-data:
