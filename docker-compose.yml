services:
  db:
    image: postgis/postgis:16-3.4
    container_name: elonuz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elonuz
      POSTGRES_PASSWORD: elonuz
      POSTGRES_DB: elonuz
    # Bound to 127.0.0.1 ONLY — Postgres is reachable from the server's loopback (for an SSH
    # tunnel / admin GUI) but never from the public internet. Do NOT change to '5432:5432' or
    # '0.0.0.0:...': that would expose elonuz:elonuz to the world.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - elonuz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elonuz -d elonuz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elonuz-redis
    restart: unless-stopped
    # Without AOF an ungraceful restart loses up to a minute of writes — including the delayed
    # BullMQ jobs that close ringing calls.
    command: redis-server --appendonly yes
    # Loopback ONLY — same rule as `db` above. Needed so the e2e suites, which run on the host
    # against REDIS_URL=localhost:6379, can reach it. Never bind to '0.0.0.0'.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - elonuz-redis-data:/data

  # One-shot: applies migrations and seeds the catalog, then exits. Built from the `build`
  # stage because the runtime image installs with --omit=dev and so has neither the Prisma
  # CLI nor ts-node. Running it as its own service also keeps migrations to a single run,
  # independent of how many backend replicas start.
  migrate:
    build:
      context: .
      target: build
    container_name: elonuz-migrate
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: 'no'

    depends_on:
      db:
        condition: service_healthy

    env_file:
      # NOTE: this Compose version interpolates env_file values, so any `$` in a secret (e.g. the
      # argon2 `ADMIN_PASSWORD_HASH`) MUST be escaped as `$$` in .env — otherwise `$argon2id`, `$v`,
      # … are read as (unset) variables and the value is mangled to a blank.
      - .env
    # Overrides whatever .env says: inside the compose network the database is `db`,
    # never localhost. `environment` takes precedence over `env_file`.
    environment:
      DATABASE_URL: postgresql://elonuz:elonuz@db:5432/elonuz?schema=public

  backend:
    build: .
    container_name: elonuz-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    env_file:
      # NOTE: this Compose version interpolates env_file values, so any `$` in a secret (e.g. the
      # argon2 `ADMIN_PASSWORD_HASH`) MUST be escaped as `$$` in .env — otherwise `$argon2id`, `$v`,
      # … are read as (unset) variables and the value is mangled to a blank.
      - .env
    # Same reason as above — service names, not localhost.
    environment:
      DATABASE_URL: postgresql://elonuz:elonuz@db:5432/elonuz?schema=public
      REDIS_URL: redis://redis:6379

    # Uploaded media lives on disk, so without this every container restart deletes it: listing
    # images AND chat attachments (CHAT_MEDIA_DIR sits under the same tree). One volume covers both.
    volumes:
      - elonuz-uploads:/app/uploads

    ports:
      - '3000:3000'

  # TURN relay for 1:1 calls (docs/architecture/calls.md, deploy/coturn/README.md). Not started by
  # a plain `docker compose up` — it needs a real TLS cert and a public IP that do not exist in
  # every environment this file is used in (local dev, CI), so it sits behind the `calls` profile.
  # Bring it up explicitly once those exist: `docker compose --profile calls up -d coturn`.
  coturn:
    image: coturn/coturn:4.16.0-alpine
    container_name: elonuz-coturn
    restart: unless-stopped
    profiles: ['calls']

    # The image's default user is non-root `nobody`, which cannot read Let's Encrypt's private
    # key: `archive/<domain>/` is `root:root 0700`, so `live/<domain>/privkey.pem` — a symlink into
    # it — is unreadable to a non-root process regardless of its own permissions. Root is what
    # lets the mounted certs below actually be read.
    user: root

    # coturn allocates a relay port PER ACTIVE CALL out of a wide range (49152-65535 by default —
    # left unset here, so min-port/max-port stay out of turnserver.conf on purpose), and mapping
    # that whole range through Docker's bridge/NAT is impractical. `network_mode: host` is
    # coturn's documented Docker deployment mode for exactly this reason.
    # NOTE: host networking makes the `ports:` list below meaningless — Docker ignores `ports:`
    # under this mode. It is kept only as a record of what the host firewall must actually open:
    #   3478/udp, 3478/tcp  — STUN/TURN
    #   5349/tcp            — TURN over TLS
    #   443/tcp             — alt-tls-listening-port; the one port open on many university networks
    #   49152-65535/udp     — the relay range
    network_mode: host
    # ports: see the note above — not used under host networking.

    entrypoint: ['/bin/sh', '/deploy/entrypoint.sh']
    # Clears the image's default CMD (`--log-file=stdout --external-ip=$(detect-external-ip)`),
    # which is meaningless here since entrypoint.sh execs turnserver itself.
    command: []

    environment:
      # Must be byte-identical to the backend's own TURN_STATIC_SECRET — coturn validates the HMAC
      # the API computes, so a mismatch fails every relayed call with an auth error, not a clear
      # one. Empty by default so `docker compose config` still parses when calls are not set up yet;
      # entrypoint.sh itself refuses to start without a real value.
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-}
      # The server's address on each side of NAT. A wrong SERVER_PUBLIC_IP is the most confusing
      # way this fails: the call connects (signalling + STUN still work through it) but there is no
      # audio, because the relay hands peers an address they can never actually reach.
      SERVER_PRIVATE_IP: ${SERVER_PRIVATE_IP:-}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}

    volumes:
      - ./deploy/coturn/turnserver.conf:/deploy/turnserver.conf.template:ro
      - ./deploy/coturn/entrypoint.sh:/deploy/entrypoint.sh:ro
      # Read-only: coturn only ever needs to read the certificate, never renew it.
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  elonuz-db-data:
  elonuz-redis-data:
  elonuz-uploads:
