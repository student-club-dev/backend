# Media uploads — no size cap, no request buffering.
#
# Include this inside the API `server { }` block, alongside socket-io.conf:
#
#     include /etc/nginx/snippets/media-upload.conf;
#
# Chat media parity spec §2 removed the per-file size limits from the application. That change is
# invisible until nginx stops enforcing one of its own: with `client_max_body_size` set, a large
# upload is answered 413 by nginx before it ever reaches Node, so nothing the application does about
# limits matters.
#
# `proxy_request_buffering off` is the other half. Left on, nginx spools the *entire* body to its own
# disk before opening the upstream connection — so a 2 GB upload is written twice, and the client
# waits through the whole first copy before the app sees a byte. Off, the body streams straight
# through to Node, which writes it once, to its final scratch directory.

location /v1/media/chat-upload {
    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A slow phone on 3G uploading a large file must not be cut off mid-body. These bound a stalled
    # connection, not a slow one.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}

# The resumable endpoints (parity spec §7). Same rules: each PUT carries one part, and the app
# streams it to disk rather than buffering it.
location /v1/media/upload/ {
    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
