# Socket.IO / WebSocket proxying for the `/chat` namespace.
#
# Include this inside the API `server { ... }` block:
#     include /etc/nginx/snippets/socket-io.conf;
#
# Without it the `transport=websocket` handshake answers 400 and Engine.IO silently falls back to
# long-polling: higher battery drain, laggy typing/presence, and frequent drops on mobile networks.
#
# `proxy_pass` must point at the Node process. On studentclub-prod that is the port Compose
# publishes (`127.0.0.1:3000`); if the site instead declares `upstream api_upstream { ... }`,
# use that name here.

location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;

    # The upgrade handshake needs HTTP/1.1 and these two headers — this is the actual fix.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Must exceed the Socket.IO ping interval, or nginx closes an idle-but-healthy socket.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Signalling and receipts must not sit in a buffer waiting to be flushed.
    proxy_buffering off;
}
